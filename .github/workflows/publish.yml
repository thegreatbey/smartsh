name: CI & Publish

on:
  push:
    branches:
      - multi

permissions:
  contents: write
  id-token: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    #environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org/"

      - name: Show Node and npm versions
        run: node -v && npm -v

      #trusted publishing needs npm cli >= 11.5.1 (see https://docs.npmjs.com/trusted-publishers/)
      - name: Upgrade npm for OIDC publish
        run: npm install -g "npm@^11.5.1"

      #version bump
      - name: Determine version bump
        id: bump
        run: |
          set -e

          COMMIT_MSG=$(git log -1 --pretty=%B)

          if [[ "$COMMIT_MSG" == *"#major"* ]]; then
            TYPE=major
          elif [[ "$COMMIT_MSG" == *"#minor"* ]]; then
            TYPE=minor
          else
            TYPE=patch
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      #install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Build
        run: bun run build

      - name: Run tests
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          ROLLUP_NO_NATIVE: "1"
        run: bun run test


      # Versioning (ONLY after CI passes)
      - name: Bump version (pre-publish)
        id: version
        run: |
          set -e

          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version

          NEWVER=$(node -p "require('./package.json').version")

          echo "new_version=$NEWVER" >> $GITHUB_OUTPUT


      - name: Check if version already exists as git tag
        run: |
          set -e

          if git rev-parse "v${{ steps.version.outputs.new_version }}" >/dev/null 2>&1; then
            echo "Tag already exists. Aborting."
            exit 1
          fi


      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      #auth: OIDC only (no NPM_TOKEN). On npmjs: Package → Settings → Trusted publishing → GitHub Actions, workflow publish.yml, repo thegreatbey/smartsh; if job uses environment "production", set that same name in npm's form.
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public

      # Only after successful publish:
      # tag + commit version bump
      - name: Commit version + tag
        run: |
          set -e

          git add package.json bun.lock || true

          git commit -m "chore: release v${{ steps.version.outputs.new_version }}"

          git tag "v${{ steps.version.outputs.new_version }}"

      # Push only after everything succeeded
      # (rollback-safe boundary)
      - name: Push changes and tags
        run: |
          set -e

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/thegreatbey/smartsh.git"

          git push origin HEAD:multi
          git push origin --tags