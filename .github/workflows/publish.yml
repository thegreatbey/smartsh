name: CI & Publish

on:
  push:
    branches:
      - multi

permissions:
  contents: write  # allow pushing tags/commits from CI
  id-token: write #for provenenace

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Show npm version #enusure npm supports provenance for sanity
        run: npm -v

      - name: Install dependencies
        run: npm ci

      - name: Determine version bump
        id: bump_type
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"#major"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == *"#minor"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Ensure clean working tree
        run: |
          echo "=== BEFORE CLEAN ==="
          git status --porcelain
          git restore --staged .
          git checkout -- .
          git clean -fd
          echo "=== AFTER CLEAN ==="
          git status --porcelain

      - name: Authenticate git remote with GITHUB_TOKEN
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/thegreatbey/smartsh.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (no tag yet)
        run: |
          npm version ${{ steps.bump_type.outputs.type }} --no-git-tag-version
          NEWVER=$(node -p "require('./package.json').version")
          echo "NEWVER=$NEWVER" >> $GITHUB_ENV
          echo "Version set to $NEWVER (no tag yet)."

      # Fix the root cause: npm shims on Linux sometimes lack +x
      - name: Fix exec bits on shims
        run: chmod +x node_modules/.bin/* || true

      # Primary build (tsup) — same as local
      - name: Build (tsup)
        run: npm run build

      # Sanity checks (keep your "esbuild mindset" without rebuilding)
      - name: Verify build artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.mjs
          if [ -f dist/index.d.ts ] || [ -f dist/index.d.mts ]; then echo "types OK"; else echo "Missing type declarations"; exit 1; fi
          test -f dist/cli.js
          head -n1 dist/cli.js | grep -q '#!/usr/bin/env node'
          ls -lah dist

      # Tests (vitest) — use the shim now that +x is fixed
      - name: Run tests (vitest)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          ROLLUP_NO_NATIVE: "1"
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Commit version, tag, and push
        run: |
          git add package.json package-lock.json || true
          git commit -m "chore: release v${NEWVER}"
          git tag "v${NEWVER}"
          git push origin HEAD:multi --follow-tags