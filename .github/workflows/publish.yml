name: CI & Publish

on:
  push:
    branches:
      - multi

permissions:
  contents: write
  id-token: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show npm version
        run: npm -v

      #version bump
      - name: Determine version bump
        id: bump
        run: |
          set -e

          COMMIT_MSG=$(git log -1 --pretty=%B)

          if [[ "$COMMIT_MSG" == *"#major"* ]]; then
            TYPE=major
          elif [[ "$COMMIT_MSG" == *"#minor"* ]]; then
            TYPE=minor
          else
            TYPE=patch
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      #install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          ROLLUP_NO_NATIVE: "1"
        run: bun run test


      # Versioning (ONLY after CI passes)
      - name: Bump version (pre-publish)
        id: version
        run: |
          set -e

          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version

          NEWVER=$(node -p "require('./package.json').version")

          echo "new_version=$NEWVER" >> $GITHUB_OUTPUT


      - name: Check if version already exists as git tag
        run: |
          set -e

          if git rev-parse "v${{ steps.version.outputs.new_version }}" >/dev/null 2>&1; then
            echo "Tag already exists. Aborting."
            exit 1
          fi


      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish to npm (Trusted Publishing)
        run: |
          npm publish --access public


      # Only after successful publish:
      # tag + commit version bump
      - name: Commit version + tag
        run: |
          set -e

          git add package.json package-lock.json

          git commit -m "chore: release v${{ steps.version.outputs.new_version }}"

          git tag "v${{ steps.version.outputs.new_version }}"

      # Push only after everything succeeded
      # (rollback-safe boundary)
      - name: Push changes and tags
        run: |
          set -e

          git push origin HEAD:multi
          git push origin --tags